; RoadNode: MeshCore is an unmodified git submodule in vendor/MeshCore.
; src_dir points at MeshCore's src/ so its inherited build_src_filter entries
; (e.g. +<../variants/heltec_v4>, +<../examples/simple_sensor>) resolve unchanged.
; RoadNode's own code lives in ./src and is added via build_src_filter.
[platformio]
src_dir = vendor/MeshCore/src
boards_dir = vendor/MeshCore/boards
extra_configs =
  vendor/MeshCore/platformio.ini
  vendor/MeshCore/variants/heltec_v4/platformio.ini

; MeshCore sensor firmware built from the submodule with RoadNode modules compiled in.
; Target: Heltec V4.3 without OLED (KCT8103L PA; plain heltec_v4 pin map, not r8).
; No DISPLAY_CLASS and no ENV_PIN_SDA/SCL, so GPIO3/4 are free for CAN.
[env:heltec_v4_roadnode]
extends = Heltec_lora32_v4
extra_scripts = vendor/MeshCore/merge-bin.py
lib_extra_dirs = vendor/MeshCore/lib
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -I src/telemetry/variant        ; RoadNode target.h shadows the vendor one (must precede the next -I)
  -I vendor/MeshCore/variants/heltec_v4
  -I src
  -I vendor/MeshCore/examples/simple_sensor
  -D PIN_BOARD_SDA=17             ; keeps MeshCore's Wire off GPIO3/4, which are the CAN pins
  -D PIN_BOARD_SCL=18
  -D PERSISTANT_GPS  ; GNSS on at boot when detected (stock default is off until `gps 1`)
  -D OBD_TRANSMIT_ENABLE          ; explicit opt-in: send OBD requests (remove for listen-only)
  -D CAN_BACKEND_MCP2515          ; Adafruit PiCowbell CAN Bus on SPI (47/41/48, CS 3, INT 4); remove for TWAI + transceiver
  -D VEHICLE_ID='"RAV4"'
  -D ADVERT_NAME='"RoadNode"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'  ; placeholder only, never commit a real one: set it per unit at deployment (docs/telemetry.md)
build_src_filter = ${Heltec_lora32_v4.build_src_filter}
  +<../examples/simple_sensor>
  -<../examples/simple_sensor/main.cpp>  ; replaced by src/node/main.cpp (alerts)
  +<../../../src>
  -<../../../src/sniffer>  ; sniffer has its own setup()/loop()
  -<../../../src/monitor>  ; monitor has its own setup()/loop()
  -<../../../src/ecusim>  ; RP2040 simulator, has its own setup()/loop()
  -<../variants/heltec_v4/target.cpp>  ; replaced by src/telemetry/variant/target.cpp
lib_deps =
  ${Heltec_lora32_v4.lib_deps}
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://vendor/MeshCore/arch/esp32/AsyncElegantOTA

; CAN sniffer: listen-only, serial frame logger. No MeshCore code.
; Controller is an MCP2515 (Adafruit PiCowbell CAN Bus) wired to the header; wiring in README.md.
[env:heltec_v4_cansniffer]
platform = platformio/espressif32@6.11.0
board = heltec_v4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -I src
  -I vendor/MeshCore/variants/heltec_v4  ; pins_arduino.h for the board
  -D CAN_BITRATE=500000
  -D CAN_BACKEND_MCP2515  ; MCP2515 on SPI (PiCowbell CAN Bus, pins in can_manager.h); remove for TWAI + transceiver
;  -D CAN_LOG_TIMESTAMPS
build_src_filter =
  -<*>
  +<../../../src/can>
  +<../../../src/sniffer>

; Loopback self-test (plan Milestone 1). Needs no CAN bus; transceiver optional.
[env:heltec_v4_canloopback]
extends = env:heltec_v4_cansniffer
build_flags =
  ${env:heltec_v4_cansniffer.build_flags}
  -D SNIFFER_LOOPBACK

; OBD monitor for in-car testing: CAN + OBD + mileage + NVS, serial output, no MeshCore.
; Transmission is an explicit opt-in (OBD_TRANSMIT_ENABLE); remove it to stay listen-only.
[env:heltec_v4_obdmonitor]
extends = env:heltec_v4_cansniffer
build_flags =
  ${env:heltec_v4_cansniffer.build_flags}
  -D OBD_TRANSMIT_ENABLE
  -D VEHICLE_ID='"RAV4"'
build_src_filter =
  -<*>
  +<../../../src/can>
  +<../../../src/obd>
  +<../../../src/vehicle>
  +<../../../src/storage>
  +<../../../src/monitor>

; Bench ECU simulator (issue 59): Adafruit Feather RP2040 CAN (MCP25625), no MeshCore.
; Pretends to be the vehicle ECU so the real node can be tested without a car. See docs/ecusim.md.
; Pins come from the board variant: CS 19, RESET 18, INT 22, STANDBY 16, SPI on GPIO 14/15/8.
[env:rp2040_ecusim]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_can
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps = adafruit/Adafruit MCP2515 @ 0.2.1
lib_ldf_mode = deep+  ; BusIO (a dependency) includes Wire.h, which is not found in the default mode
build_flags =
  -I src
  -D CAN_BITRATE=500000
;  -D ECUSIM_CAN_CLOCK_HZ=8000000  ; set if the board's crystal is not 16 MHz (unconfirmed)
build_src_filter =
  -<*>
  +<../../../src/ecusim>
