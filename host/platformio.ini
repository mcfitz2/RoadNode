; Host unit tests for hardware-independent code. Run from the repo root:
;   pio test -d host
; Separate project so the root platformio.ini's src_dir (MeshCore) doesn't apply.
[platformio]
src_dir = ../src
test_dir = ../test

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -I ../src -I ../test/support -std=gnu++17 -pthread
build_src_filter =
  -<*>
  +<vehicle/>
  +<storage/>
  +<obd/>
  +<gps/>
  +<ecusim/>
  +<can/mcp2515.cpp>  ; pure driver; the rest of can/ needs Arduino/ESP-IDF
  -<ecusim/main.cpp>  ; RP2040 firmware entry point
