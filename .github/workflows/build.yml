name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release upload on tags
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini', '.gitmodules') }}-${{ hashFiles('vendor/MeshCore/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: scripts/check_no_raw_can.sh
      - run: scripts/check_vendor_drift.sh
      - run: pio test -d host
      - name: Build firmware
        run: pio run -e heltec_v4_roadnode -e heltec_v4_cansniffer -e heltec_v4_canloopback -e heltec_v4_obdmonitor -e rp2040_ecusim 2>&1 | tee build.log
      - name: Size report
        run: scripts/size_report.sh build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Merge flashable image
        run: pio run -e heltec_v4_roadnode -t mergebin
      - uses: actions/upload-artifact@v4
        with:
          name: roadnode-heltec_v4-${{ github.sha }}
          path: .pio/build/heltec_v4_roadnode/firmware-merged.bin
          if-no-files-found: error
      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .pio/build/heltec_v4_roadnode/firmware-merged.bin "roadnode-heltec_v4-${GITHUB_REF_NAME}.bin"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "roadnode-heltec_v4-${GITHUB_REF_NAME}.bin" --clobber
